<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Active les animations d'apparition uniquement si JS tourne (voir .reveal dans index.css) -->
    <script>
      document.documentElement.classList.add('js');
    </script>
    <title>Architecte d'intérieur Vannes &amp; Golfe du Morbihan | Maison Mikasa</title>
    <meta
      name="description"
      content="Laurine Fourcherot, architecte d'intérieur à Baden : conception sur-mesure, rénovation et suivi de chantier à Vannes, Auray et dans le Golfe du Morbihan."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:title" content="Architecte d'intérieur Vannes &amp; Golfe du Morbihan | Maison Mikasa" />
    <meta
      property="og:description"
      content="Laurine Fourcherot, architecte d'intérieur à Baden : conception sur-mesure, rénovation et suivi de chantier à Vannes, Auray et dans le Golfe du Morbihan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.maisonmikasa.fr/" />
    <meta property="og:image" content="https://www.maisonmikasa.fr/og/home.jpg" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Maison Mikasa" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Architecte d'intérieur Vannes &amp; Golfe du Morbihan | Maison Mikasa" />
    <meta
      name="twitter:description"
      content="Laurine Fourcherot, architecte d'intérieur et décoratrice à Baden, Vannes et dans tout le Golfe du Morbihan."
    />
    <meta name="twitter:image" content="https://www.maisonmikasa.fr/og/home.jpg" />

    <!-- Theme + canonical -->
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="canonical" href="https://www.maisonmikasa.fr/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- No manual LCP preload tag here: React 19 automatically hoists a
         correctly-hashed <link rel="preload"> for each page's eager hero
         image during the SSR pass in scripts/prerender.ts. -->

    <!-- Self-hosted fonts (public/fonts/, declared in index.css) — no more
         render-blocking request to fonts.googleapis.com. Preload only the
         two faces used above the fold: Montserrat (body) and Playfair
         Display (headings). -->
    <link
      rel="preload"
      href="/fonts/montserrat-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/playfair-display-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="bg-canvas text-stone-700 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
